name: Paisa
options:
  bundleIdPrefix: com.shashankmahajan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: QWXY4T9SKT
targets:
  Paisa:
    type: application
    platform: iOS
    sources:
      - Paisa
      - Shared
    info:
      path: Paisa/Info.plist
      properties:
        CFBundleDisplayName: Paisa Inbox
        CFBundleVersion: "2"
        NSSpeechRecognitionUsageDescription: Paisa Inbox transcribes your review explanation on device.
        NSMicrophoneUsageDescription: Paisa Inbox uses the microphone only while you choose to speak.
        PaisaRemotePushEnabled: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.shashankmahajan.paisa
            CFBundleURLSchemes:
              - paisa
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Paisa/Paisa.entitlements
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.shashankmahajan.paisa
    dependencies:
      - target: PaisaShare
    scheme:
      testTargets: []
  PaisaShare:
    type: app-extension
    platform: iOS
    sources:
      - PaisaShare
      - Shared
    info:
      path: PaisaShare/Info.plist
      properties:
        CFBundleDisplayName: Share to Paisa Inbox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: PaisaShare/PaisaShare.entitlements
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.shashankmahajan.paisa.share
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.0
